name: Bug Report
description: Report a problem with educational tools or projects
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue! This helps improve our educational tools and resources.

  - type: dropdown
    id: project-type
    attributes:
      label: Project Type
      description: What type of project is this issue related to?
      options:
        - Student Assignment
        - Educational Tool
        - Administrative System
        - Course Material
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: What environment are you using? (e.g., Web browser, Node.js version, Python version)
      placeholder: ex. Chrome 118, Node.js 18.x, Python 3.9
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug you encountered
      placeholder: A clear and concise description of what the bug is
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: A clear description of what you expected to happen
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here, including screenshots if applicable
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have read the [Code of Conduct](../CODE_OF_CONDUCT.md)
          required: true
        - label: I have searched for existing issues before creating this one
          required: true
        - label: This issue is related to educational activities at ICSA
          required: true