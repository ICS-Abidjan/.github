name: Student Help Request
description: Students can request help with assignments or technical issues
title: "[Help]: "
labels: ["help-wanted", "student-support"]
body:
  - type: markdown
    attributes:
      value: |
        Need help with your assignment or a technical issue? We're here to support your learning!
        
        **Note**: Please do not share complete assignment solutions. Focus on specific problems or concepts you're struggling with.

  - type: dropdown
    id: subject-area
    attributes:
      label: Subject Area
      description: What subject or area is this related to?
      options:
        - Computer Science/Programming
        - Mathematics
        - Science
        - Technology Integration
        - Digital Literacy
        - Research Methods
        - Other Academic Subject
        - General Technical Issue
    validations:
      required: true

  - type: dropdown
    id: help-type
    attributes:
      label: Type of Help Needed
      description: What kind of assistance are you looking for?
      options:
        - Understanding a Concept
        - Debugging Code
        - Technical Setup Issue
        - Assignment Clarification
        - Tool Usage Help
        - Research Guidance
        - Collaboration Support
        - Other
    validations:
      required: true

  - type: input
    id: assignment-context
    attributes:
      label: Assignment/Project Context
      description: What assignment or project is this related to? (Optional - general help is also welcome)
      placeholder: ex. Python Programming Assignment #3, Science Fair Project
    validations:
      required: false

  - type: textarea
    id: specific-problem
    attributes:
      label: Specific Problem or Question
      description: What exactly are you stuck on or need help with?
      placeholder: Be as specific as possible about what you're trying to accomplish and where you're getting stuck
    validations:
      required: true

  - type: textarea
    id: what-tried
    attributes:
      label: What Have You Tried?
      description: What approaches or solutions have you already attempted?
      placeholder: Describe what you've tried so far and what happened
    validations:
      required: true

  - type: textarea
    id: code-or-examples
    attributes:
      label: Code or Examples (if applicable)
      description: Share relevant code snippets or examples (without sharing complete solutions)
      render: text
      placeholder: |
        ```
        // Share the specific part you're having trouble with
        // Don't include complete assignment solutions
        ```
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency Level
      description: How urgent is this help request?
      options:
        - Low - General learning question
        - Medium - Assignment due this week
        - High - Assignment due tomorrow
        - Emergency - Technical issue blocking work
    validations:
      required: true

  - type: checkboxes
    id: learning-focus
    attributes:
      label: Learning Commitment
      description: Please confirm your approach to getting help
      options:
        - label: I want to understand the concept, not just get the answer
          required: true
        - label: I have made a genuine attempt to solve this myself
          required: true
        - label: I will not share complete solutions with other students inappropriately
          required: true
        - label: I understand this is for learning purposes
          required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Any other context that might help us assist you better
      placeholder: Include any error messages, screenshots, or other relevant details
    validations:
      required: false