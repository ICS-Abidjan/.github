# Basic Educational Project Workflow
# This template can be used for simple projects that need basic testing and validation

name: Educational Project CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Basic checks that can apply to most educational projects
  basic-checks:
    runs-on: ubuntu-latest
    name: Basic Project Validation
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check for common files
      run: |
        echo "Checking for basic project structure..."
        if [ -f "README.md" ]; then
          echo "✅ README.md found"
        else
          echo "⚠️  Consider adding a README.md file to document your project"
        fi
        
        if [ -f "LICENSE" ] || [ -f "LICENSE.md" ] || [ -f "LICENSE.txt" ]; then
          echo "✅ License file found"
        else
          echo "ℹ️  Consider adding a license for your project"
        fi
    
    - name: Check file sizes
      run: |
        echo "Checking for large files that might not belong in version control..."
        find . -size +10M -type f ! -path "./.git/*" || echo "No large files found"
    
    - name: Basic security check
      run: |
        echo "Checking for potential secrets in code..."
        if grep -r -i "password\|api_key\|secret\|token" --include="*.py" --include="*.js" --include="*.java" --include="*.cpp" --include="*.c" --include="*.rb" . || true; then
          echo "⚠️  Found potential secrets in code. Please review and remove any real credentials"
        else
          echo "✅ No obvious secrets found in common file types"
        fi

